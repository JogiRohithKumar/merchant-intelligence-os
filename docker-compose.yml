version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: merchant_os
      POSTGRES_USER: merchant_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchant_os_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merchant-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - merchant-net

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://merchant_os:${POSTGRES_PASSWORD:-merchant_os_secret}@postgres:5432/merchant_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_data:/app/data/models
      - chroma_data:/app/data/chroma_db
    networks:
      - merchant-net

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.tasks worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql://merchant_os:${POSTGRES_PASSWORD:-merchant_os_secret}@postgres:5432/merchant_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_data:/app/data/models
    networks:
      - merchant-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - merchant-net

volumes:
  postgres_data:
  model_data:
  chroma_data:

networks:
  merchant-net:
    driver: bridge
